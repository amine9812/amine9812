name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview (languages + activity)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: amine9812
          template: classic
          base: header, activity, community, repositories, metadata
          filename: github-metrics.svg
          config_timezone: Africa/Casablanca

          plugin_languages: yes
          plugin_languages_limit: 12
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14

      - name: Languages (detailed)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: amine9812
          template: classic
          base: header
          filename: github-metrics-languages.svg

          plugin_languages: yes
          plugin_languages_limit: 20
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes

      - name: Calendar graph (year)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: amine9812
          template: classic
          base: header
          filename: github-metrics-calendar.svg

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
